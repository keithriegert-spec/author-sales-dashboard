<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'">
  <title>Author Sales Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@500&display=swap">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='16 31 262 158'%3E%3Cpolygon fill='%23fcd68f' points='18,138 132,84 132,178 18,178'/%3E%3Cpolygon fill='%238e9663' points='102,33 200,38 216,168 102,168'/%3E%3Cpolygon fill='%23c64b14' points='185,101 275,121 275,187 185,187'/%3E%3Cpolygon fill='%238c7e38' points='102,98.2 132,84 132,168 102,168'/%3E%3Cpolygon fill='%236e2c08' points='185,101 207.8,106.1 216,168 185,168'/%3E%3C/svg%3E">
</head>
<body>
  <!-- Sign in -->
  <main id="login-view" class="login" hidden>
    <form id="login-form" class="login-card" autocomplete="on" novalidate>
      <div class="brand brand-stack" role="img" aria-label="The Stable Book Group">
        <svg class="mark" viewBox="16 31 262 158" aria-hidden="true" focusable="false">
          <polygon class="m-gold" points="18,138 132,84 132,178 18,178"/>
          <polygon class="m-sage" points="102,33 200,38 216,168 102,168"/>
          <polygon class="m-rust" points="185,101 275,121 275,187 185,187"/>
          <polygon class="m-gold-sage" points="102,98.2 132,84 132,168 102,168"/>
          <polygon class="m-sage-rust" points="185,101 207.8,106.1 216,168 185,168"/>
        </svg>
        <div class="wordmark"><span class="wm-1">THE STABLE</span><span class="wm-2">BOOK GROUP</span></div>
      </div>
      <div class="rule"></div>
      <h1>Author Sales Dashboard</h1>
      <p class="muted">Sign in with the username and password you were given.</p>
      <label>Username
        <input id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
      </label>
      <label>Password
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </label>
      <p id="login-error" class="error" role="alert" hidden></p>
      <button id="login-btn" type="submit">Sign in</button>
    </form>
  </main>

  <!-- Dashboard -->
  <div id="dash-view" hidden>
    <div class="brandbar">
      <div class="brandbar-inner">
        <div class="brand" role="img" aria-label="The Stable Book Group">
          <svg class="mark" viewBox="16 31 262 158" aria-hidden="true" focusable="false">
          <polygon class="m-gold" points="18,138 132,84 132,178 18,178"/>
          <polygon class="m-sage" points="102,33 200,38 216,168 102,168"/>
          <polygon class="m-rust" points="185,101 275,121 275,187 185,187"/>
          <polygon class="m-gold-sage" points="102,98.2 132,84 132,168 102,168"/>
          <polygon class="m-sage-rust" points="185,101 207.8,106.1 216,168 185,168"/>
        </svg>
          <div class="wordmark"><span class="wm-1">THE STABLE</span><span class="wm-2">BOOK GROUP</span></div>
          <span class="brand-tag">Author Portal</span>
        </div>
        <button id="logout" class="ghost" type="button">Sign out</button>
      </div>
    </div>
    <header class="topbar">
      <div>
        <p class="eyebrow">Author sales</p>
        <h1 id="author-name"></h1>
      </div>
    </header>

    <div class="layout">
      <aside class="sidebar" aria-label="Sales totals">
        <section class="stat">
          <h2>Most recent week</h2>
          <p class="stat-value" id="stat-week"></p>
          <p class="stat-sub" id="stat-week-sub"></p>
          <p class="stat-delta" id="stat-week-delta"></p>
        </section>
        <section class="stat">
          <h2>Year to date</h2>
          <p class="stat-value" id="stat-ytd"></p>
          <p class="stat-sub" id="stat-ytd-sub"></p>
          <p class="stat-delta" id="stat-ytd-delta"></p>
        </section>
        <section class="stat">
          <h2>Lifetime</h2>
          <p class="stat-value" id="stat-life"></p>
          <p class="stat-sub" id="stat-life-sub"></p>
        </section>
      </aside>

      <section class="card chart-card" aria-labelledby="chart-title">
        <div class="chart-head">
          <div>
            <h2 id="chart-title">Unit sales</h2>
            <p class="muted" id="chart-sub"></p>
          </div>
          <div class="controls">
            <div class="seg" role="group" aria-label="Time range" id="range-seg">
              <button type="button" data-range="6">6M</button>
              <button type="button" data-range="12">1Y</button>
              <button type="button" data-range="36">3Y</button>
              <button type="button" data-range="60">5Y</button>
              <button type="button" data-range="0">All</button>
            </div>
            <div class="seg" role="group" aria-label="Grouping" id="gran-seg">
              <button type="button" data-gran="week">Weekly</button>
              <button type="button" data-gran="month">Monthly</button>
            </div>
          </div>
        </div>
        <div id="chart" class="chart"></div>
        <div id="tooltip" class="tooltip" hidden></div>
        <details class="table-view">
          <summary>View as table</summary>
          <div class="table-wrap"><table id="data-table"><thead><tr><th scope="col">Period</th><th scope="col">Units</th></tr></thead><tbody></tbody></table></div>
        </details>
      </section>
    </div>
    <footer class="foot muted" id="foot"></footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
